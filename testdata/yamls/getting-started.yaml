  - type: heading
    level: 2
    text: "Comparison"
  - type: table
    headers: ["Feature", "Supported"]
    rows:
      - ["Headings", "yes"]
      - ["Tables", "yes"]
  - type: quote
    text: "Simple tools, used well, go a long way."
  - type: hr
  - type: paragraph
    text: "See the README for more."
